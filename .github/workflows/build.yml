# KADEM.exe'yi GitHub'ın Windows makinesinde derler ve indirilebilir zip olarak koyar.
# Çalıştırma: depo sayfası → Actions → "Windows exe" → Run workflow
# (main dalına her yüklemede ve v* etiketlerinde kendiliğinden de çalışır).
name: Windows exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  # Kaynak kod README'de yazan bütün Python sürümlerinde okunabiliyor mu
  sozdizimi:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tüm dosyaları derle
        run: python -m compileall -q -f kadem tests baslat.py

  build:
    needs: sozdizimi
    runs-on: windows-latest
    permissions:
      contents: write   # sürüm (release) oluşturmak için
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: KADEM.exe derle
        run: python -m PyInstaller --noconfirm --clean KADEM.spec

      - name: Exe açılıyor mu (duman testi)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\KADEM\KADEM.exe" -ArgumentList "--port","8765","--pencere-yok","--token","ci" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8765/api/ping" -Headers @{ "X-Token" = "ci" } -Body "{}" -ContentType "application/json"
              Write-Host "Sunucu yanıt verdi: $($r | ConvertTo-Json -Compress -Depth 3)"
              $ok = $true
              break
            } catch { }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "KADEM.exe başladı ama 60 saniye içinde yanıt vermedi." }

      - name: Zip olarak koy (Actions sayfası, 90 gün)
        uses: actions/upload-artifact@v4
        with:
          name: KADEM_Windows
          path: dist/KADEM/
          retention-days: 90

      # Yalnızca v* etiketlerinde: KADEM_Windows.zip'i kalıcı olarak sürüm (Releases) sayfasına koy.
      # Sürüm notu CHANGELOG.md'deki ilgili bölümden alınır. Zenodo bu sürümü arşivleyip DOI verir.
      - name: Sürüm zip'i ve notu hazırla
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path dist\KADEM\* -DestinationPath KADEM_Windows.zip
          $surum = "${{ github.ref_name }}".TrimStart('v')
          python -c "import re,sys; s=open('CHANGELOG.md',encoding='utf-8').read(); m=re.search(r'^## '+re.escape(sys.argv[1])+r'\s*\n(.*?)(?=^## |\Z)', s, re.S|re.M); open('surum_notu.md','w',encoding='utf-8').write((m.group(1).strip() if m else 'See CHANGELOG.md.')+'\n\nWindows: download KADEM_Windows.zip below, extract it and run KADEM.exe (no Python needed).\n')" $surum
          Get-Content surum_notu.md

      - name: Sürümü yayınla
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: KADEM ${{ github.ref_name }}
          body_path: surum_notu.md
          files: KADEM_Windows.zip
